
workflows:
  wasalni-android:
    name: Wasalni Android APK
    max_build_duration: 60

    environment:
      java: 21
      node: 20
      groups: []

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        script: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
