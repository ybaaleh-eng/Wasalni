
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f6b">
<title>وصلني</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma;background:#f2f6f4;color:#183d34}
header{background:#087f6b;color:white;padding:25px 18px;border-radius:0 0 25px 25px}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
main{max-width:650px;margin:auto;padding:15px}
.panel,.shop,.cart{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h2{font-size:20px}
button{border:0;border-radius:10px;padding:12px;background:#087f6b;color:white;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area{padding:25px 8px;font-size:19px}
.hidden{display:none!important}
.categories{display:flex;gap:8px;overflow:auto;padding:10px 0}
.categories button{white-space:nowrap;background:#e6f2ed;color:#087f6b}
.categories button.active{background:#087f6b;color:white}
.shop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop b{font-size:17px}
.shop small{display:block;color:#777;margin-top:7px}
.product{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.price{color:#087f6b;font-weight:bold}
.secondary{background:#e6f2ed;color:#087f6b}
.cart{position:sticky;bottom:5px}
.cartline{display:flex;justify-content:space-between;padding:8px 0}
</style>
</head>
<body>
<header>
<h1>🚀 وصلني</h1>
<p>كل طلباتك لحد باب بيتك</p>
</header>

<main>
<section id="areas" class="panel">
<h2>اختر منطقتك</h2>
<p>أهلاً بك في وصلني، أين تريد الطلب؟</p>
<div class="areas">
<button class="area" onclick="choose('الرحيبة')">📍 الرحيبة</button>
<button class="area" onclick="choose('القطيفة')">📍 القطيفة</button>
</div>
</section>

<section id="market" class="hidden">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center">
<div><small>منطقتك</small><h2 id="areaName"></h2></div>
<button class="secondary" onclick="back()">تغيير</button>
</div>
</div>

<div class="panel">
<h2>المحلات والمتاجر</h2>
<input id="search" placeholder="ابحث عن محل..." oninput="render()">
<div id="categories" class="categories"></div>
<button onclick="showAdd()">＋ إضافة محل جديد</button>
</div>

<div id="shops"></div>
<div id="details" class="panel hidden"></div>

<div id="addPanel" class="panel hidden">
<h2>إضافة محل</h2>
<input id="shopName" placeholder="اسم المحل">
<select id="shopCategory" style="margin-top:10px">
<option>سوبرماركت</option>
<option>مطاعم</option>
<option>خضار وفواكه</option>
<option>صيدليات</option>
<option>حلويات</option>
<option>ألبسة</option>
<option>موبايلات</option>
</select>
<button style="margin-top:10px" onclick="saveShop()">حفظ المحل</button>
</div>
</section>

<section id="cart" class="cart hidden">
<h3>🛒 سلة المشتريات</h3>
<div id="items">السلة فارغة</div>
<p>المجموع: <b id="total" class="price">0 ل.س</b></p>
<p>طريقة الدفع: كاش عند الاستلام</p>
<button style="width:100%" onclick="checkout()">تأكيد الطلب التجريبي</button>
</section>
</main>

<script>
let area='';
let category='الكل';
let active=null;
let cart=[];

let shops=[
{id:1,area:'الرحيبة',name:'ماركت الحارة',cat:'سوبرماركت',products:[['مياه شرب',5000],['خبز',3000],['مواد غذائية',30000]]},
{id:2,area:'الرحيبة',name:'مطعم الوجبة الطيبة',cat:'مطاعم',products:[['وجبة برغر',45000],['وجبة دجاج',55000]]},
{id:3,area:'الرحيبة',name:'خضار وفواكه الخير',cat:'خضار وفواكه',products:[['سلة خضار',25000],['سلة فواكه',35000]]},
{id:4,area:'القطيفة',name:'سوبرماركت السوق',cat:'سوبرماركت',products:[['مياه شرب',5000],['مواد تموينية',40000]]},
{id:5,area:'القطيفة',name:'مطعم البيت الشامي',cat:'مطاعم',products:[['فروج مشوي',70000],['شاورما',25000]]},
{id:6,area:'القطيفة',name:'صيدلية تجريبية',cat:'صيدليات',products:[['طلب صيدلية تجريبي',25000]]}
];

let extra=JSON.parse(localStorage.getItem('wasalni_shops')||'[]');
shops=shops.concat(extra);

function choose(a){
area=a;
document.getElementById('areas').classList.add('hidden');
document.getElementById('market').classList.remove('hidden');
document.getElementById('cart').classList.remove('hidden');
document.getElementById('areaName').textContent=a;
categories();
render();
}
function back(){
document.getElementById('market').classList.add('hidden');
document.getElementById('cart').classList.add('hidden');
document.getElementById('areas').classList.remove('hidden');
}
function categories(){
let cats=['الكل','سوبرماركت','مطاعم','خضار وفواكه','صيدليات','حلويات','ألبسة','موبايلات'];
document.getElementById('categories').innerHTML=cats.map(c=>
`<button class="${c===category?'active':''}" onclick="setCat('${c}')">${c}</button>`
).join('');
}
function setCat(c){category=c;categories();render();}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=shops.filter(s=>s.area===area&&
(category==='الكل'||s.cat===category)&&
s.name.toLowerCase().includes(q));
document.getElementById('shops').innerHTML=list.length?
list.map(s=>`
<div class="shop">
<div><b>${safe(s.name)}</b><small>${safe(s.cat)} • ${safe(s.area)}</small></div>
<button onclick="openShop(${s.id})">عرض المحل</button>
</div>`).join(''):
'<div class="panel">لا توجد محلات حالياً بهذا القسم.</div>';
}
function openShop(id){
active=shops.find(s=>s.id===id);
let d=document.getElementById('details');
d.classList.remove('hidden');
d.innerHTML=`<h2>${safe(active.name)}</h2>
${active.products.map((p,i)=>`
<div class="product">
<div><b>${safe(p[0])}</b><br><span class="price">${money(p[1])}</span></div>
<button onclick="add(${active.id},${i})">أضف للسلة</button>
</div>`).join('')}`;
d.scrollIntoView({behavior:'smooth'});
}
function add(id,i){
let s=shops.find(x=>x.id===id);
if(cart.length&&cart[0].id!==id){
if(!confirm('السلة فيها منتجات من محل آخر. هل تريد تغيير المحل؟'))return;
cart=[];
}
let p=s.products[i];
cart.push({id,name:p[0],price:p[1]});
drawCart();
}
function drawCart(){
document.getElementById('items').innerHTML=cart.length?
cart.map((x,i)=>`
<div class="cartline">
<span>${safe(x.name)}</span>
<span>${money(x.price)} <button class="secondary" onclick="removeItem(${i})">×</button></span>
</div>`).join(''):'السلة فارغة';
document.getElementById('total').textContent=money(cart.reduce((a,x)=>a+x.price,0));
}
function removeItem(i){cart.splice(i,1);drawCart();}
function money(n){return Number(n).toLocaleString('en-US')+' ل.س';}
function checkout(){
if(!cart.length){alert('السلة فارغة');return;}
alert('طلب تجريبي بقيمة '+money(cart.reduce((a,x)=>a+x.price,0))+
'\nالدفع كاش عند الاستلام.\nلم يتم إرسال الطلب فعلياً إلى محل.');
}
function showAdd(){document.getElementById('addPanel').classList.remove('hidden');}
function saveShop(){
let name=document.getElementById('shopName').value.trim();
let cat=document.getElementById('shopCategory').value;
if(!name){alert('اكتب اسم المحل');return;}
let s={id:Date.now(),area,name,cat,products:[['منتج تجريبي',10000]]};
extra.push(s);
shops.push(s);
localStorage.setItem('wasalni_shops',JSON.stringify(extra));
document.getElementById('shopName').value='';
document.getElementById('addPanel').classList.add('hidden');
render();
alert('تمت إضافة المحل على هذا الجهاز كتجربة.');
}
function safe(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
